# ===========================================================================
#  CI Pipeline — Continuous Integration
# ===========================================================================
#  Triggered on every push to main and on every pull request targeting main.
#  This pipeline ensures that code is tested, buildable, and free of known
#  HIGH/CRITICAL vulnerabilities BEFORE it can be merged or deployed.
#
#  Flow: checkout → setup node → install → test → build image → scan image
# ===========================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel any in-progress CI runs for the same branch when a new push arrives.
# Saves runner minutes and avoids queueing stale builds.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Restrict the default GITHUB_TOKEN to read-only.
# Individual jobs can escalate permissions only where needed.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      # ---------------------------------------------------------------
      # 1. Checkout — pull the repository code onto the runner
      # ---------------------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # ---------------------------------------------------------------
      # 2. Setup Node.js with dependency caching
      #    `cache: npm` tells the action to cache ~/.npm between runs,
      #    keyed on the hash of package-lock.json — dramatically speeds
      #    up `npm ci` when dependencies haven't changed.
      # ---------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      # ---------------------------------------------------------------
      # 3. Install dependencies
      #    `npm ci` (clean install) is the CI-safe alternative to
      #    `npm install`:
      #      - Uses the lock file exactly (deterministic)
      #      - Deletes node_modules first (clean slate)
      #      - Fails if lock file is out of sync with package.json
      # ---------------------------------------------------------------
      - name: Install dependencies
        working-directory: app
        run: npm ci

      # ---------------------------------------------------------------
      # 4. Run unit tests — Jest with coverage
      #    If any test fails, the whole pipeline fails here and the
      #    Docker build step never runs (fail-fast).
      # ---------------------------------------------------------------
      - name: Run tests
        working-directory: app
        run: npm test

      # ---------------------------------------------------------------
      # 5. Build Docker image
      #    Tagged with the git commit SHA so every image is uniquely
      #    traceable back to a specific commit (immutable tagging).
      # ---------------------------------------------------------------
      - name: Build Docker image
        run: docker build -t devops-pipeline-app:${{ github.sha }} ./app

      # ---------------------------------------------------------------
      # 6. Security scan with Trivy
      #    Scans the built image for known CVEs at HIGH and CRITICAL
      #    severity.  exit-code: "1" makes the pipeline FAIL if any
      #    are found — this is "shifting security left" (catch issues
      #    in CI, not in production).
      # ---------------------------------------------------------------
      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devops-pipeline-app:${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: "1"
